<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboration 2 - TypeScript</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
    <main>
        <h1>Att göra lista</h1>
        <div id="err-container">
            <ul id="error-area"></ul>
        </div>
        <form id="form">
            <label for="todo-assign">Uppgift att göra</label>
            <input type="text" name="todo-assign" id="todo-assign" placeholder="Skriv uppgift">
            <br>
            <label for="todo-priority">Prioritet <span class="span-priority">(1 = högst, 3 = lägst)</span></label>
            <input type="text" name="todo-priority" id="todo-priority" maxlength="1" placeholder="Skriv prioritet för uppgift">
            <br>
            <button type="submit" class="add-btn">Lägg till uppgift<svg xmlns="http://www.w3.org/2000/svg" height="24px"
                    viewBox="0 -960 960 960" width="24px" fill="#000">
                    <path
                        d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q65 0 123 19t107 53l-58 59q-38-24-81-37.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q32 0 62-6t58-17l60 61q-41 20-86 31t-94 11Zm280-80v-120H640v-80h120v-120h80v120h120v80H840v120h-80ZM424-296 254-466l56-56 114 114 400-401 56 56-456 457Z" />
                </svg></button>
            <button id="delete-button" class="hidden" type="button">Radera alla uppgifter<svg
                    xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff">
                    <path
                        d="m376-300 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 180q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z" />
                </svg></button>
        </form>
        <button id="sort-button" class="hidden" type="button">Sortera prioritet<svg xmlns="http://www.w3.org/2000/svg"
                height="24px" id="sort-icon" viewBox="0 -960 960 960" width="24px" fill="#fff">
                <path d="M120-240v-80h240v80H120Zm0-200v-80h480v80H120Zm0-200v-80h720v80H120Z" />
            </svg></button>
        <div id="todo-list"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
